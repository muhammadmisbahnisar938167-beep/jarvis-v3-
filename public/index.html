<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS V3</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at center, #10222d 0%, #05080c 45%, #020304 100%);
    color: white;
    font-family: Arial, sans-serif;
}
.container {
    width: 100%;
    max-width: 600px;
    min-height: 100vh;
    margin: auto;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
}
.header { text-align: center; }
.logo {
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 8px;
    color: #00cfff;
    text-shadow: 0 0 10px #00cfff, 0 0 25px #008cff;
}
.version {
    margin-top: 5px;
    color: #71818c;
    font-size: 11px;
    letter-spacing: 3px;
}
.core-area {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 30px 0;
}
.core {
    width: 165px;
    height: 165px;
    border-radius: 50%;
    border: 3px solid #00cfff;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 15px #00cfff, 0 0 40px #0077ff, inset 0 0 30px #0077ff;
    animation: pulse 2s infinite;
    position: relative;
}
.core::before {
    content: "";
    width: 105px;
    height: 105px;
    border-radius: 50%;
    border: 2px solid #00cfff;
    box-shadow: 0 0 20px #00cfff, inset 0 0 20px #00cfff;
}
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}
.status {
    text-align: center;
    color: #00cfff;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 12px;
}
.chat-box {
    width: 100%;
    min-height: 180px;
    max-height: 310px;
    overflow-y: auto;
    background: rgba(8,15,21,0.95);
    border: 1px solid #075d79;
    border-radius: 16px;
    padding: 14px;
}
.message {
    margin: 9px 0;
    padding: 11px 12px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 14px;
}
.jarvis-message {
    background: #071b25;
    border-left: 3px solid #00cfff;
}
.user-message {
    background: #151a20;
    border-right: 3px solid #777;
    text-align: right;
}
.input-area {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}
#command {
    flex: 1;
    background: #0b1117;
    border: 1px solid #17637c;
    border-radius: 11px;
    padding: 14px;
    color: white;
    outline: none;
    font-size: 14px;
}
button {
    border: none;
    border-radius: 11px;
    padding: 12px 16px;
    background: #00cfff;
    color: #001018;
    font-weight: bold;
    cursor: pointer;
}
#sendButton { min-width: 70px; }
.footer {
    text-align: center;
    margin-top: auto;
    padding-top: 22px;
    color: #46535c;
    font-size: 9px;
    letter-spacing: 2px;
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">JARVIS</div>
        <div class="version">ARTIFICIAL INTELLIGENCE • V3</div>
    </div>

    <div class="core-area">
        <div class="core"></div>
    </div>

    <div class="status" id="status">SYSTEM ONLINE</div>

    <div class="chat-box" id="chatBox">
        <div class="message jarvis-message">
            Welcome sir. I am JARVIS V3.<br><br>How may I assist you?
        </div>
    </div>

    <div class="input-area">
        <input id="command" type="text" placeholder="Give me a command, sir..." autocomplete="off">
        <button id="sendButton" onclick="sendCommand()">SEND</button>
    </div>

    <div class="footer">JARVIS V3 • MISBAH</div>
</div>

<script>
const commandInput = document.getElementById("command");
const chatBox = document.getElementById("chatBox");
const statusText = document.getElementById("status");

commandInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        sendCommand();
    }
});

function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    message.innerText = text;
    chatBox.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function sendCommand() {
    const command = commandInput.value.trim();
    if (!command) return;

    addMessage(command, "user-message");
    commandInput.value = "";
    askJARVIS(command);
}

async function askJARVIS(command) {
    try {
        statusText.innerText = "JARVIS THINKING...";

        const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ command: command })
        });

        const data = await response.json();
        
        if (!response.ok) {
            throw new Error(data.reply || "Server error");
        }

        respond(data.reply);

    } catch (error) {
        console.error("JARVIS ERROR:", error);
        statusText.innerText = "SYSTEM ONLINE";
        respond("I could not connect to the server, sir. Please check your setup.");
    }
}

function respond(text) {
    addMessage(text, "jarvis-message");
    statusText.innerText = "SYSTEM ONLINE";
}
</script>

</body>
</html>
